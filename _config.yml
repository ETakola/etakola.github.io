  desc: "I am a Greek ecologist and meta-analyst leading the BIOECOS group at Helmholtz Centre for Environmental Research – UFZ (Leipzig, Germany). My research focuses on cross-scale data syntheses to explore organism-environment relationships and species interactions and on promoting open science principles. My ResearchGate Interest Score ranks among the top 1% of members who first published in 2020. As of 2024, I have co-authored papers with researchers across all permanently inhabited continents."
